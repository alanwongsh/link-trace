<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you | MR DIY</title>
  <style>
    /* Brand colours are approximations. Replace them with the official MR DIY brand values. */
    :root {
      --brand-yellow: #ffd200;
      --brand-red: #e3262b;
      --ink: #1c1916;
      --muted: #5f5a52;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--brand-yellow);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 20px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
    }

    .logo {
      display: block;
      max-width: 180px;
      max-height: 72px;
      margin: 0 auto 28px;
    }

    /* Shown only if the logo image fails to load. */
    .logo-text {
      display: none;
      margin: 0 auto 28px;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--brand-red);
    }

    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--brand-red);
      display: grid;
      place-items: center;
    }

    .check svg { width: 36px; height: 36px; }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 8px;
      color: var(--muted);
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      border-radius: 999px;
      background: var(--brand-red);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .button:hover { filter: brightness(0.92); }

    footer {
      margin-top: 28px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- Put the official logo at public/mrdiy-logo.png in this app, or replace src with a hosted logo URL. -->
    <img
      class="logo"
      src="https://www.klgatewaymall.com/data/editor/stores/shop/KLGM-Tenants_Mr-DIY-600x600.png?v=1575606305240"
      alt="MR DIY"
      onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';"
    >
    <div id="logo-text" class="logo-text" aria-hidden="true">MR DIY</div>

    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1>Thank you for your time!</h1>
    <footer>You can close this page now.</footer>
  </main>
</body>
</html>
